<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Variable Sum Example</title>
</head>
<body>
  <h2>Variable Operations</h2>
  <div id="output"></div>

  <script>
    let a = 23;
    let b = 65;
    let c = a + b;
    a += 57
    document.getElementById("output").innerHTML =
      "Initial values: a = 23, b = 65<br>" +
      "c = a + b = " + c + "<br>" +
    \  "After a += 57, new a = " + a;
  </script>
</body>
</html>
